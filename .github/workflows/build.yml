name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${NEWEST}" ]; then sudo xcode-select -s "${NEWEST}"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Apply tolerant-decoding patch
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n tolerant-init-v1 AniTV/Apis/Selector/SelectorSearchConfig.swift

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          bash scripts/build-user-signable-tvos-ipa.sh 2>&1 | tee /tmp/build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist
          cp /tmp/build.log dist/build.log 2>/dev/null || echo "no build.log" > dist/build.log
          ls -la scripts/output/user-signable-ipa/ > dist/ipa-listing.txt 2>&1 || true
          cp scripts/output/user-signable-ipa/*.ipa dist/ 2>/dev/null || echo NO_IPA_PRODUCED > dist/NO_IPA.txt

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AniTV build ${{ github.run_number }}
          files: dist/*
